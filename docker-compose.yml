version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: football_ai_postgres
    environment:
      POSTGRES_DB: football_ai
      POSTGRES_USER: football_user
      POSTGRES_PASSWORD: football_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football_user -d football_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 